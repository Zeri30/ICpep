# Render Blueprint fragment for the scheduler cron job — see SETUP.md's
# "Wiring up the scheduler" section for context and manual (dashboard) setup
# steps.
#
# This is NOT a complete deployment blueprint: it defines only the cron job
# that runs Laravel's scheduler, not the backend web service or the frontend.
# If you already deploy the backend on Render, merge the `services` entry
# below into your existing render.yaml rather than deploying this file
# standalone, and point `envVars` at whatever Environment Group (or literal
# values) the web service already uses so the two never drift out of sync.
#
# Field names here reflect Render's Blueprint spec at the time this was
# written — verify against the current reference before relying on it:
# https://render.com/docs/blueprint-spec
#
# Render has no native PHP runtime for services — `backend/Dockerfile` is
# what actually runs the app, and this cron job reuses the same image so its
# PHP version/extensions never drift from the web service it's maintaining.

services:
  - type: cron
    name: icpep-scheduler
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: singapore
    plan: starter
    schedule: "* * * * *"
    # Laravel decides what's actually due to run (see routes/console.php) —
    # this fires every minute, but remember-tokens:prune and
    # activity-log:prune themselves only execute once a day.
    startCommand: php artisan schedule:run
    envVars:
      # Reuse the backend web service's environment group so DB/Supabase
      # credentials are defined once, not duplicated here.
      - fromGroup: icpep-backend
